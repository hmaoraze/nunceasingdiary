# 友情链接页面数据 | 对应站点的 /links/ 页面
# 每个一级条目代表一个链接分类，可在页面上分组显示

- links_category: This is the first categrory   # 分类名称（显示为该分组的标题）
  has_thumbnail: true                              # 该分类下的链接是否显示缩略图（true=显示, false=不显示）
  list:                                            # 该分类下的链接列表
      - name: hmao的日记                            # 网站名称
        link: https://blog.imce.cn                  # 网站链接
        description: 记录我的生活和学习              # 网站描述
        avatar: /images/avatar-1.jpg                # 头像图片路径
        thumbnail: /images/desc-image.jpg           # 缩略图路径（仅 has_thumbnail 为 true 时才需要）

- links_category: This is the second categrory   # 第二个分类
  has_thumbnail: false                             # 不显示缩略图
  list:
      - name: Partner Link 1                       # 网站名称
        link: https://example.com                   # 网站链接
        description: Example Site Imformation       # 网站描述
        avatar: /images/avatar-1.jpg                # 头像图片路径
      - name: Partner Link 2
        link: https://example.com
        description: Example Site Description
        avatar: /images/avatar-2.png
      - name: Partner Link 3
        link: https://example.com
        description: Example Site Description
        avatar: /images/avatar-3.png
