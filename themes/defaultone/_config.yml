# HOME BANNER | 首页横幅 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/home/home_banner
home_banner:
  # Whether to enable home banner | 是否启用首页横幅
  enable: true
  # Style of home banner | 首页横幅样式
  style: static # static=静态, fixed=固定背景
  # Home banner image | 首页横幅背景图片
  image: 
    light: /images/main_bg_ligth.jpg # 浅色模式图片
    dark: /images/main_bg.jpg # 暗黑模式图片
  # Home banner title | 首页横幅标题
  title: hmao的日记
  # Home banner subtitle | 首页横幅副标题（打字机效果）
  subtitle:
    text: ['写下去，就会精彩！'] # 副标题文字（数组，轮播打字）
    hitokoto:  # 一言（Hitokoto）配置，随机显示一句动漫/文学语录
      enable: false # 是否启用一言
      show_author: true # 是否显示语录作者
      api: https://v1.hitokoto.cn # 一言 API 地址（可添加类型参数，详见文档）
    typing_speed: 100 # 打字速度（毫秒/字）
    backing_speed: 80 # 删除速度（毫秒/字）
    starting_delay: 500 # 开始延迟（毫秒）
    backing_delay: 1500 # 删除后停顿延迟（毫秒）
    loop: true # 是否循环播放
    smart_backspace: true # 是否智能退格（只删除不同的字）
  # Color of home banner text | 首页横幅文字颜色
  text_color: 
    light: "#fff" # 浅色模式文字颜色
    dark: "#d1d1b6" # 暗黑模式文字颜色
  # Specific style of the text | 文字样式细节
  text_style: 
    # Title font size | 标题字号
    title_size: 2.8rem
    # Subtitle font size | 副标题字号
    subtitle_size: 1.5rem
    # Line height between title and subtitle | 标题和副标题之间的行高
    line_height: 1.2
  # Home banner custom font | 首页横幅自定义字体
  custom_font: 
    # Whether to enable | 是否启用
    enable: true
    # Font family | 字体族
    family: 
    # URL to font CSS file | 字体 CSS 文件 URL
    url:
  # Home banner social links | 首页横幅社交链接
  social_links:
    # Whether to enable | 是否启用
    enable: true
    # Social links style | 社交链接样式
    style: default # default=默认, reverse=反转, center=居中
    # Social links | 各平台链接
    links:
      github:  https://github.com/hmaoraze/nunceasingdiary # GitHub 链接
      instagram: # Instagram 链接
      zhihu:  # 知乎链接
      # twitter:  https://x.com/TencentCloudEO # Twitter/X 链接
      email:  # 邮箱地址
      # ...... # 可添加更多链接
    # Social links with QRcode drawers | 带二维码弹窗的社交链接
    qrs:
      weixin: https://cdn.timens.cn/img/article/qrcode_for_gh_0ae2679e9701_860.jpg!/format/webp  # 微信二维码图片 URL
      # ...... # 可添加更多二维码
# HOME BANNER | 首页横幅 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# NAVIGATION BAR | 导航栏 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
