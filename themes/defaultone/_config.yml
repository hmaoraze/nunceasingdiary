# SITE CUSTOMIZATION | 站点自定义设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/basic/global
global:
  # Custom global fonts | 自定义全局字体
  fonts:
    # Chinese fonts | 中文字体
    chinese: 
      enable: true # 是否启用自定义中文字体
      family: "'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" # 字体族（按优先级回退）
      url: "https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" # 字体 CSS 文件 URL
    # English fonts | 英文字体
    english: 
      enable: true # 是否启用自定义英文字体
      family: "'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" # 字体族
      url: "https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" # 字体 CSS 文件 URL
    # Custom title fonts | 自定义标题字体（导航栏、侧边栏）
    title:
      enable: true # 是否启用自定义标题字体
      family: "'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" # 字体族
      url: "https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" # 字体 CSS 文件 URL
  # Content max width | 内容区域最大宽度
  content_max_width: 1000px
  # Sidebar width | 侧边栏宽度
  sidebar_width: 210px
  # Effects on mouse hover | 鼠标悬停效果
  hover:
    shadow: true # 阴影效果（鼠标悬停时显示阴影）
    scale: false # 缩放效果（鼠标悬停时放大元素）
  # Scroll progress | 页面滚动进度显示
  scroll_progress:
    bar: false # 进度条（页面顶部显示阅读进度条）
    percentage: true # 百分比（显示阅读百分比数字）
  # Website counter | 网站访问量统计
  website_counter:
    url: https://cn.vercount.one/js # 统计 API 地址（一般无需修改）
    enable: true # 是否启用网站统计
    site_pv: true # 站点总浏览量（PV）
    site_uv: true # 站点独立访客数（UV）
    post_pv: true # 文章页面浏览量
  # Whether to enable single page experience | 是否启用单页体验（使用 swup，类似 pjax，页面无刷新跳转）
  single_page: true
  # Preloader | 页面加载动画
  preloader:
    enable: true # 是否启用加载动画
    custom_message: # 自定义加载文字（留空则显示网站标题）
  # Open Graph | 社交分享元标签（分享到社交平台时的预览信息）
  open_graph:
    enable: true # 是否启用
    image: /images/og.webp  # 默认分享图片
    description: This is your blog. # 默认分享描述
  # Google Analytics | 谷歌统计分析
  google_analytics:
    enable: false # 是否启用 Google Analytics
    id:  # Google Analytics 测量 ID
# SITE CUSTOMIZATION | 站点自定义设置 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end
    

# FONTAWESOME | 图标库设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/basic/fontawesome
fontawesome: # Font Awesome Pro v6.2.1 图标库
  # Thin version | 细体图标
  thin: false
  # Light version | 轻量图标
