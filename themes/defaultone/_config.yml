      path: /links/  # 友情链接页面
      icon: fa-solid fa-link
    About: 
      path: /about  # 关于页面
      icon: fa-solid fa-circle-info
      # submenus:
      #   Me: /about
      #   Github: https://github.com/EvanNotFound/hexo-theme-redefine
      #   Blog: https://ohevan.com
      #   Friends: /friends
