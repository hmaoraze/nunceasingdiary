# COLORS | 配色方案 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/basic/colors
colors:
  # Primary color | 主题色（十六进制颜色值）
  primary: "#009688"
  # Secondary color | 辅助色（待定，暂未启用）
  secondary:
  # Default theme mode | 默认主题模式（会被系统偏好覆盖）
