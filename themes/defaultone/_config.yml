# HOME PAGE ARTICLE SETTINGS | 首页文章设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/home/home
home:
  # Sidebar settings | 侧边栏设置
  sidebar:
    enable: true # 是否启用侧边栏
    position: left # 侧边栏位置（left=左侧, right=右侧）
    first_item: menu # 侧边栏首项（menu=菜单, info=个人信息）
    announcement: # 公告文字
    show_on_mobile: true # 移动端是否在底部弹出菜单中显示侧边栏导航
    links: # 侧边栏链接
      Archives: 
        path: /archives 
        icon: fa-regular fa-archive
      # Tags: 
      #   path: /tags 
      #   icon: fa-regular fa-tags
      # Categories: 
      #   path: /categories 
      #   icon: fa-regular fa-folder
      # ...... # 可添加更多链接
  # Article date format | 文章日期显示格式
  article_date_format: auto # auto=自动, relative=相对时间, YYYY-MM-DD=年月日等自定义格式
  # Article excerpt length | 文章摘要字数上限
  excerpt_length: 200
  # Article categories visibility | 文章分类显示设置
  categories:
    enable: false  # 是否显示文章分类
    limit: 3 # 最多显示几个分类
  # Article tags visibility | 文章标签显示设置
  tags:
    enable: false  # 是否显示文章标签
    limit: 3  # 最多显示几个标签
# HOME PAGE ARTICLE SETTINGS | 首页文章设置 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# ARTICLE | 文章页面设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/posts/articles
articles:
  # Set the styles of the article | 文章样式设置
  style:
    font_size: 16px # 正文字号
    line_height: 1.5 # 正文行高
    image_border_radius: 14px # 图片圆角
    image_alignment: center # 图片对齐方式（left=左对齐, center=居中）
    image_caption: false # 是否显示图片标题说明
    link_icon: true # 是否在链接旁显示链接图标
    delete_mask: true # 是否给删除线内容添加遮罩（hover 才显示）
    title_alignment: left # 文章标题对齐（left=左对齐, center=居中）
    headings_top_spacing: # 各级标题顶部间距（h1-h6）
      h1: 3.2rem
      h2: 2.4rem
      h3: 1.9rem
      h4: 1.6rem
      h5: 1.4rem
      h6: 1.3rem
  # Word count | 字数统计（需安装 hexo-wordcount 插件）
  word_count:
    enable: true # 是否启用
    count: true # 是否显示字数
    min2read: true # 是否显示预计阅读时间
  # Author label | 作者标签（等级标签）
  author_label: 
    enable: false # 是否启用
    auto: false # 是否自动生成等级（如 Lv1, Lv2, Lv3...）
    list: [] # 手动配置的标签列表
  # Code block settings | 代码块设置
  code_block:
    copy: true # 是否显示复制按钮
    style: mac # 代码块样式（mac=Mac 风格圆点, simple=简洁）
    highlight_theme: # highlight.js 代码高亮主题
      light: github # 浅色模式主题（可选: github, atom-one-light, default）
      dark: vs2015 # 暗黑模式主题（可选: github-dark, monokai-sublime, vs2015, night-owl, atom-one-dark, nord, tokyo-night-dark, a11y-dark, agate）
    font: # 代码块自定义字体
      enable: false # 是否启用
      family: # 字体族
      url: # 字体 CSS 文件 URL
  # Table of contents settings | 文章目录设置
  toc:
    enable: true # 是否启用目录
    max_depth: 3 # 目录最大深度（h1-h3）
    number: false # 是否自动给目录添加序号
    expand: true # 是否展开目录
    init_open: true # 是否默认打开目录
  # Whether to enable copyright notice | 文章版权声明
  copyright:
    enable: true # 是否启用版权声明
    default: cc_by_nc_sa # 默认许可协议（cc_by_nc_sa=署名-非商业-相同方式共享, cc_by_nd, cc_by_nc, cc_by_sa, cc_by, all_rights_reserved=保留所有权利, public_domain=公共领域）
  # Whether to enable lazyload for images | 图片懒加载
  lazyload: true
  # Pangu.js | 中英文之间自动加空格（需装 pangu.js）
  pangu_js: false
  # Article recommendation | 文章推荐（基于内容相似度，需安装 nodejieba 中文分词）
  recommendation:
    # Whether to enable | 是否启用
    enable: false
    # Article recommendation title | 推荐文章标题
    title: Recommended Reading
    # Max number of articles | 最多推荐文章数
    limit: 3
    # Max number of articles on mobile | 移动端最多推荐文章数
    mobile_limit: 2
    # Placeholder image | 无封面文章占位图
    placeholder: /images/wallhaven-wqery6-light.webp
    # Skip directory | 跳过不参与推荐的目录
    skip_dirs: []
# ARTICLE | 文章页面设置 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end

# EFFECTS | 特效开关
effects: 
  particles: true       # 是否启用粒子背景特效
  cursoreffects: false   # 是否启用鼠标点击特效


# COMMENT | 评论系统 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/posts/comment
comment:
  # Whether to enable comment | 是否启用评论
  enable: true
  # Comment system | 评论系统选择
  system: waline # waline, gitalk, twikoo, giscus
  # System configuration | 各系统配置
  config:
    # Waline 评论系统（轻量、无后端）
    waline:
      serverUrl: https://walinecommentapi.imce.cn/ # Waline 服务端地址
      lang: zh-CN # 语言（zh-CN=中文, en-US=英文）
      emoji: [] # 自定义表情包
      recaptchaV3Key: # Google reCAPTCHA v3 密钥
      turnstileKey: # Cloudflare Turnstile 密钥
      reaction: false # 是否启用文章表情反应
    # Gitalk 评论系统（基于 GitHub Issues）
    gitalk:
      clientID: # GitHub OAuth App Client ID
      clientSecret: # GitHub OAuth App Client Secret
      repo: # GitHub 仓库名
      owner: # GitHub 仓库所有者
      proxy: # GitHub 代理地址
    # Twikoo 评论系统
    twikoo:
      version: 1.6.10 # Twikoo 版本号
      server_url: # Twikoo 服务端地址
      region: # Twikoo 区域（可留空）
    # Giscus 评论系统（基于 GitHub Discussions）
    giscus:
      repo: # GitHub 仓库名（如 EvanNotFound/hexo-theme-redefine）
      repo_id: # GitHub 仓库 ID
      category: # GitHub Discussions 分类名
      category_id: # GitHub Discussions 分类 ID
      mapping: pathname # 页面映射方式（pathname=路径, url=完整URL, title=标题, og:title=OG标题。启用PJAX时不要用og:title）
      strict: 0 # 严格模式（0=关闭, 1=开启）
      reactions_enabled: 1 # 是否启用表情反应（0=关闭, 1=开启）
      emit_metadata: 0 # 是否发送元数据（0=关闭, 1=开启）
      lang: zh-CN # 语言
      input_position: bottom # 评论框位置（top=上方, bottom=下方）
      loading: lazy # 加载方式（lazy=懒加载）
# COMMENT | 评论系统 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# FOOTER | 页脚设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
