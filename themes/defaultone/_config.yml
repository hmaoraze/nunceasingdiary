# PLUGINS | 插件设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/plugins
plugins:
  # RSS feed | RSS 订阅（需安装 hexo-generator-feed）
  feed:
    enable: false # 是否启用
  # Aplayer | 音乐播放器（网页音乐播放）
  aplayer:
    enable: false # 是否启用
    type: fixed # fixed=固定悬浮, mini=迷你播放器
    audios: # 音乐列表
      - name: # 歌曲名称
        artist: # 歌手
        url: # 歌曲文件 URL
        cover: # 封面图片 URL
        lrc: # 歌词文件 URL
#      - name: # 第二首歌曲
#        artist: # 歌手
#        url: # 歌曲 URL
#        cover: # 封面 URL
#        lrc: # 歌词 URL
      # .... 可添加更多歌曲
  # Mermaid | 流程图/图表渲染（需安装 hexo-filter-mermaid-diagrams）
  mermaid:
    enable: false # 是否启用
    version: "11.4.1" # Mermaid 版本号
# PLUGINS | 插件设置 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# PAGE TEMPLATES | 页面模板设置 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/page_templates
page_templates:
  # Friend Links page column number | 友情链接页面每行列数
  friends_column: 3
  # Tags page style | 标签页面样式
  tags_style: blur # blur=模糊标签云, cloud=经典云标签
# PAGE TEMPLATES | 页面模板设置 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# CDN | 内容分发加速 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/cdn
cdn:
  # Whether to enable CDN | 是否启用 CDN 加速
  enable: false
  # CDN Provider | CDN 提供商
  provider: npmmirror # npmmirror, zstatic, cdnjs, jsdelivr, unpkg, custom
  # Custom CDN URL | 自定义 CDN 地址
  # 格式: https://cdn.custom.com/hexo-theme-redefine/${version}/source/${path}
  # ${path} 必须指向主题 "source" 文件夹的根目录
  custom_url: 
# CDN | 内容分发加速 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end

# DEVELOPER MODE | 开发者模式 >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/developer
developer:
  # Whether to enable developer mode | 是否启用开发者模式（仅用于二次开发主题源码，普通用户不要开启）
  enable: false
# DEVELOPER MODE | 开发者模式 <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end
