# Stellar 站点配置（覆盖 themes/stellar/_config.yml 的默认值）
# 数组会整体替换，所以菜单、社交等数组项要写全。

# 站点级顶栏（v2 默认关闭，用左侧栏导航）
topbar:
  enabled: false

# 左侧栏：品牌信息 + 主导航
leftbar:
  enabled: true
  default_state: expanded
  brand:
    search: true
    style: regular
    image:
      src: /images/avatar-1-240.webp
      variant: avatar
    name: hmao的日记
    tagline: 写下去，就会精彩！
    href: /
  menu_columns: 1
  menu:
    - id: post
      title: 文章
      icon: default:documents
      url: /
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: moments
      title: 动态
      icon: default:moments
      url: /moments/
    - id: masonry
      title: 相册
      icon: default:album
      url: /masonry/
    - id: friends
      title: 友链
      icon: default:link
      url: /links/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
  # 侧栏底部操作区
  footer:
    actions:
      - type: link
        icon: default:github
        title: GitHub
        url: https://github.com/hmaoraze/nunceasingdiary
      - type: link
        icon: default:rss
        title: RSS
        url: /atom.xml

rightbar:
  enabled: true

# 外观：延续原来的青绿主色
appearance:
  preset: card
  colors:
    primary: "#009688"
    accent: "#e05c3e"
    link: "#00897b"
  shape:
    radius:
      card_large: 20px
      card: 14px
      card_small: 10px
      bar: 10px

# 主内容区页脚
footer:
  content: |
    本站由 hmao 使用 [Stellar](https://github.com/xaoxuu/hexo-theme-stellar) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

    [吉ICP备2025031965号-4](https://beian.miit.gov.cn) · [吉公网安备22010702000366号](http://www.beian.gov.cn/portal/registerSystemInfo)

# 博客列表页
profiles:
  blog_index:
    path: /blog/
    listing_nav:
      enabled: true
      tabs: []
  page:
    rightbar:
      widgets:
        - toc

# 搜索：本地索引（hexo-generator-searchdb）
search:
  provider: local
  local:
    scope: post
    include_content: true

# 外部图床预连接（比中间件 Link 头更早生效）
preconnect:
  - https://image.hsmao.cn
  - https://cdn.timens.cn

# 文章页
article:
  show_reading_time: true
  related_posts_limit: 0
  listing:
    show_tags: false
    excerpt_length: 120

# 浏览器功能
features:
  color_scheme_switch:
    enabled: true
  lightbox:
    enabled: true
  # 列表页预取会在首屏把多篇文章一起拉下来（实测多出约 100 KB），关掉
  link_prefetch:
    enabled: false

# 注入：站点验证 + 纪念日全站灰度
inject:
  head_end: |
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <meta name="google-site-verification" content="JArnHByKrqwt-sC_WEZHn71anyBXCmGPAwz3MObHNrs" />
    <script>
    (function () {
      var md = (new Date().getMonth() + 1) + '-' + new Date().getDate();
      var days = ['9-18', '9-30', '12-13', '7-7', '9-3', '10-25'];
      if (days.indexOf(md) > -1) {
        document.documentElement.style.filter = 'grayscale(1)';
      }
    })();
    </script>
