# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site | 站点设置
title: hmao的日记                         # 网站标题
subtitle: '写下去，就会精彩！'                         # 网站副标题
description: '记录我的生活和学习'                         # 网站描述（用于SEO）
keywords: '记录, 生活, 学习, 日记'                         # 网站关键词（用于SEO）
author: hmao                     # 作者名称
language: zh-CN                         # 网站语言（中文改为 zh-CN）
timezone: 'Asia/Shanghai'                         # 时区（留空使用系统默认）

# URL | 网址设置
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.imce.cn              # 网站域名
permalink: :title/                   # 文章永久链接格式
permalink_defaults:                  # 永久链接默认值
pretty_urls:
  trailing_index: true               # 是否在链接末尾显示 index.html（false 则隐藏）
  trailing_html: true                # 是否在链接末尾显示 .html（false 则隐藏）

# Directory | 目录设置
source_dir: source                   # 源文件目录
public_dir: public                   # 生成静态文件输出目录
# tag_dir: tags                      # 标签目录
# archive_dir: archives              # 归档目录
# category_dir:                      # 分类目录
code_dir: downloads/code             # 代码下载目录
i18n_dir: :lang                      # 国际化目录
skip_render:                         # 跳过渲染的文件列表

# Writing | 文章设置
new_post_name: :title.md             # 新文章文件名格式
default_layout: post                 # 默认布局模板
titlecase: false                     # 是否将标题自动转换为首字母大写
external_link:
  enable: true                       # 外部链接是否在新标签页打开
  field: site                        # 应用范围（site=全站）
  exclude: ''                        # 排除的链接
filename_case: 0                     # 文件名大小写转换（0=不变, 1=小写, 2=大写）
render_drafts: false                 # 是否渲染草稿
post_asset_folder: false             # 是否为每篇文章创建资源文件夹
relative_link: false                 # 是否使用相对链接
future: true                         # 是否显示未来日期的文章
syntax_highlighter: highlight.js     # 代码高亮引擎
highlight:
  line_number: true                  # 是否显示行号
  auto_detect: false                 # 是否自动检测语言
  tab_replace: ''                    # 制表符替换字符
  wrap: true                         # 是否换行
  hljs: false                        # 是否使用 highlight.js
prismjs:
  preprocess: true                   # 是否预处理
  line_number: true                  # 是否显示行号
  tab_replace: ''                    # 制表符替换字符

# Home page setting | 首页设置
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''                           # 首页路径
  per_page: 10                       # 每页显示文章数
  order_by: -date                    # 文章排序（-date=按日期倒序）

# Category & Tag | 分类 & 标签
default_category: uncategorized      # 默认分类名
category_map:                        # 分类别名映射
tag_map:                             # 标签别名映射

# Metadata elements | 元数据设置
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true                 # 是否在页面中插入 generator 元标签

# Date / Time format | 日期时间格式
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD             # 日期显示格式
time_format: HH:mm:ss               # 时间显示格式
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'              # 文章更新时间的来源（mtime=文件修改时间, date=文章date字段, empty=不显示）

# Pagination | 分页设置
## Set per_page to 0 to disable pagination
per_page: 10                         # 每页文章数
pagination_dir: page                 # 分页目录名

# Include / Exclude file(s) | 包含 / 排除文件
## include:/exclude: options only apply to the 'source/' folder
include:                             # 强制包含的文件
exclude:                             # 强制排除的文件
ignore:                              # 忽略的文件

# Extensions | 插件 & 主题
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: defaultone                    # 使用的主题名称

# Search | 本地搜索设置
## Docs: https://github.com/papertiger/hexo-generator-searchdb
search:
  path: search.xml                  # 搜索索引文件路径
  field: post                       # 搜索范围（post=文章, page=页面, all=全部）
  content: true                     # 是否索引文章全文

# Deployment | 部署设置
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''                           # 部署类型（如 git、ftp 等）

# Live2D | 看板娘设置
live2d:
  enable: true                       # 是否启用 Live2D 看板娘
  scriptFrom: local                  # 脚本来源（local=本地, jsdelivr=CDN）
  pluginRootPath: live2dw/           # 插件根路径
  pluginJsPath: lib/                 # JS 文件路径
  pluginModelPath: assets/           # 模型文件路径
  tagMode: false                     # 是否通过标签模式加载
  log: false                         # 是否在控制台输出日志
  model:
    use: live2d-widget-model-wanko   # 使用的模型（wanko 小狗模型）
  display:
    position: right                  # 显示位置（left=左, right=右）
    width: 150                       # 看板娘宽度
    height: 300                      # 看板娘高度
  mobile:
    show: true                       # 移动端是否显示
  react:
    opacity: 0.7                     # 看板娘透明度（0-1）
